services:
  - type: web
    name: mgp-proxy
    runtime: docker
    # OJO: en el plan free esto NO funciona, probado. Da 512 MB y 0.1 de CPU, y
    # el challenge de Cloudflare choca contra las dos cosas: con el timeout por
    # defecto (90s) Chromium no llega a resolverlo, y si se le da más tiempo se
    # come la memoria y el contenedor muere por OOM y reinicia.
    #
    # Hace falta una instancia con ~2 GB y CPU de verdad. Queda como referencia
    # para ese caso; para el día a día conviene la opción A o B del README.
    plan: free
    healthCheckPath: /stats/data
    envVars:
      - key: MGP_TRANSPORT
        value: web
      - key: MGP_BROWSER_PATH
        value: /usr/bin/chromium
      # En una instancia lenta el challenge tarda mucho más que en una PC (20s).
      # Subirlo sólo tiene sentido si hay memoria de sobra: con poca RAM, darle
      # más tiempo a Chromium termina en OOM en vez de en éxito.
      - key: MGP_CHALLENGE_TIMEOUT_MS
        value: "180000"
      # Ojo: acá el clearance NO se puede inyectar desde casa. La cookie queda
      # atada a la IP que la pidió, y la IP de Render no es la tuya — el
      # contenedor tiene que resolver el challenge por su cuenta o no hay proxy.
      - key: ADMIN_TOKEN
        generateValue: true

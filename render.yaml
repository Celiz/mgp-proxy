services:
  - type: web
    name: mgp-proxy
    runtime: docker
    # El approach viejo (CDP + Chrome real + Xvfb) medía 90s+ para resolver el
    # challenge y confirmadamente no entraba en el free tier (512 MB / 0.1
    # CPU). El bridge actual (Scrapling/patchright) resuelve el Turnstile
    # headless en ~10s en una PC — sin Xvfb, que era parte del problema de
    # memoria. No está verificado todavía cuánta RAM pide patchright bajo
    # 512 MB reales; si el contenedor muere por OOM, subir de plan.
    plan: free
    healthCheckPath: /stats/data
    envVars:
      - key: MGP_TRANSPORT
        value: web
      # Techo para resolver el challenge. Generoso a propósito: en una
      # instancia lenta puede tardar más que los ~10s medidos en una PC.
      - key: MGP_CHALLENGE_TIMEOUT_MS
        value: "180000"
      # Habilita POST /admin/bridge/restart, para forzar un re-init manual si
      # el bridge queda pegado sin tener que reiniciar el servicio entero.
      - key: ADMIN_TOKEN
        generateValue: true
      # Fast path: repetir las requests con curl_cffi en vez de pasarlas por el
      # navegador. El spike lo validó contra producción (respuesta byte a byte
      # idéntica al control). Ojo con qué esperar: con el bridge procesando un
      # comando por vez esto todavía NO baja el p95 -- lo que gana hoy es poder
      # servir durante el hueco de ~10s de cada renovación en vez de encolar.
      # Si Cloudflare rechaza la clearance, cae solo al camino de siempre.
      - key: MGP_BRIDGE_FAST_FETCH
        value: "1"
      # El que ganó el spike. Se puede sacar y lo deduce del User-Agent, pero
      # fijarlo evita depender de qué Chromium traiga patchright en cada build.
      - key: MGP_BRIDGE_FAST_IMPERSONATE
        value: chrome146
